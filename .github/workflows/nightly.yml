name: Nightly real model

# A real on-device run, which CI's fake model can't show: install Ollama,
# download the smallest Apache-2.0 model, benchmark it, and run a local crew
# on it in Privacy Mode.
on:
  schedule:
    - cron: "0 18 * * *"  # 02:00 in the Philippines
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-model:
    name: Ollama and a local crew
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OLLAMA_VERSION: 0.24.0
      OLLAMA_SHA256: 15c5f8d66ba06e0d3b4719df8868612dbd66e14e82760929bb3552e1657cdcdb
      MODEL: qwen3:1.7b  # 1.4 GB, Apache-2.0: no licence to accept
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no job pushes
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: echo "JULI_DATA_DIR=$RUNNER_TEMP/juli" >> "$GITHUB_ENV"  # runner.temp isn't allowed in job env
      - run: python -m pip install -e .

      - name: Install and start Ollama
        run: |
          archive=ollama-linux-amd64.tar.zst
          curl -sSfL -o "$archive" "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/$archive"
          echo "${OLLAMA_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ollama"
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/ollama"
          "$RUNNER_TEMP/ollama/bin/ollama" serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 1; done

      - name: Hardware and catalogue
        run: |
          juli hardware
          juli models catalogue

      - name: Download and benchmark
        run: |
          juli models pull "$MODEL"
          juli models list
          juli models bench "$MODEL"

      - name: A Privacy Mode run on the real model
        run: |
          python - <<'EOF'
          import os
          from juli import config

          settings = config.load_settings()
          for agent in settings["agents"].values():
              agent["model"] = "ollama:" + os.environ["MODEL"]
              agent["max_tokens"] = 300  # keeps a CPU run short
          config.save_settings(settings)
          EOF
          juli mode privacy
          juli run "Write a Python function add(a, b) that returns the sum, with one pytest test." --plan --discuss 0 -o "$RUNNER_TEMP/out"
          ls -l "$RUNNER_TEMP/out"

      # The reviewer gets read-only tools; a small model may still answer without
      # calling one, so that is a warning, while a failed run fails the job.
      - name: A tool-calling run on the real model
        run: |
          juli run "Read README.md with the read_file tool, then review it in two sentences." --review -o "$RUNNER_TEMP/out"
          python - <<'EOF'
          import sqlite3
          from juli import config

          with sqlite3.connect(config.db_path()) as db:
              (run_id, status), = db.execute("SELECT id, status FROM runs ORDER BY id DESC LIMIT 1")
              tools = db.execute("SELECT content FROM messages WHERE run_id = ? AND message_type = 'tool'", (run_id,)).fetchall()
          print(f"Run {run_id}: {status}, {len(tools)} tool call(s): {[t[0] for t in tools]}")
          assert status == "complete", status
          if not tools:
              print("::warning::The model answered without calling a tool")
          EOF

      - if: failure()
        run: tail -n 100 "$RUNNER_TEMP/ollama.log"
